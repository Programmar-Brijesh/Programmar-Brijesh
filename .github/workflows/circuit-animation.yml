name: Generate Cyber Circuit Animation

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch:      # Allows you to run it manually from the Actions tab
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_circuit.py'

jobs:
  generate-animation:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Required to push the new SVG back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Animation Generator
        run: python scripts/generate_circuit.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update procedural cyber circuit animation"
          file_pattern: 'assets/cyber-circuit.svg'
