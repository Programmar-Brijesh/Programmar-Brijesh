<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 10" width="100%" height="10">
    <style>
        .glowing-dot {
            fill: #39FF14;
            animation: moveDot 3s linear infinite;
            filter: drop-shadow(0px 0px 4px #39FF14);
        }
        @keyframes moveDot {
            0% { transform: translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateX(800px); opacity: 0; }
        }
    </style>
    <!-- Base track -->
    <rect x="0" y="4" width="800" height="1" fill="#ffffff" opacity="0.1"/>
    <!-- Animated light -->
    <rect x="0" y="3" width="60" height="3" class="glowing-dot" rx="1.5"/>
</svg>
