<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&amp;family=Inter:wght@800&amp;display=swap');
      .bg { fill: #080B10; }
      .grid { stroke: #101720; stroke-width: 1; }
      .text-name { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 48px; fill: #E8F0F7; }
      .text-title { font-family: 'Fira Code', monospace; font-size: 18px; fill: #39FF88; letter-spacing: 2px; }
      .text-identity { font-family: 'Fira Code', monospace; font-size: 14px; fill: #00E5FF; }
      .circuit { fill: none; stroke: #00E5FF; stroke-width: 2; stroke-dasharray: 200; stroke-dashoffset: 200; animation: dash 4s linear infinite; opacity: 0.6; }
      .circuit-green { stroke: #39FF88; animation: dash 3s linear infinite reverse; }
      .glow-filter { filter: drop-shadow(0 0 8px rgba(57,255,136,0.6)); }
      @keyframes dash {
        to { stroke-dashoffset: 0; }
      }
      .node { fill: #39FF88; animation: pulse 2s infinite alternate; }
      @keyframes pulse {
        0% { r: 2; opacity: 0.5; filter: drop-shadow(0 0 2px #39FF88); }
        100% { r: 4; opacity: 1; filter: drop-shadow(0 0 8px #39FF88); }
      }
    </style>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" class="grid" fill="none"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="100%" fill="url(#gridPattern)" />
  
  <!-- Animated Circuits -->
  <path d="M 0 50 L 150 50 L 200 100 L 800 100" class="circuit" />
  <path d="M 800 200 L 650 200 L 600 150 L 0 150" class="circuit circuit-green" />
  <path d="M 50 0 L 50 80 L 100 130 L 100 250" class="circuit" />
  
  <!-- Glowing Nodes -->
  <circle cx="150" cy="50" class="node" />
  <circle cx="650" cy="200" class="node" style="fill:#00E5FF; animation-delay: 1s;" />
  <circle cx="200" cy="100" class="node" style="animation-delay: 0.5s;" />
  
  <!-- Typography -->
  <text x="400" y="110" text-anchor="middle" class="text-name glow-filter">BRijesh Verma</text>
  <text x="400" y="145" text-anchor="middle" class="text-title">PROGRAMMER BRIJESH</text>
  <text x="400" y="175" text-anchor="middle" class="text-identity">[ DarkCypher Identity • Application Builder ]</text>
</svg>
