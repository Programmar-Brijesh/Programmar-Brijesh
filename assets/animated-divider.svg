<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 20" width="800" height="20">
  <defs>
    <style>
      .bg-line { stroke: #101720; stroke-width: 2; }
      .scanner { fill: #39FF88; filter: drop-shadow(0 0 5px #00E5FF); animation: scan 3s ease-in-out infinite; }
      @keyframes scan {
        0% { transform: translateX(50px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateX(750px); opacity: 0; }
      }
    </style>
  </defs>
  <line x1="0" y1="10" x2="800" y2="10" class="bg-line" />
  <rect x="0" y="8" width="40" height="4" rx="2" class="scanner" />
</svg>
