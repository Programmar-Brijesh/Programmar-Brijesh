<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" width="380" height="90">
  <defs>
    <style>
      .bg { fill: #0B0F16; rx: 6px; }
      .border-glow { fill: none; stroke: #00E5FF; stroke-width: 3; rx: 6px; stroke-dasharray: 40 800; animation: run 3.2s linear infinite reverse; }
      .title { font-family: 'Fira Code', monospace; font-size: 18px; fill: #E8F0F7; font-weight: bold; }
      .sub { font-family: 'Fira Code', monospace; font-size: 12px; fill: #93A4B7; }
      .icon { fill: #00E5FF; filter: drop-shadow(0 0 4px rgba(0,229,255,0.6)); animation: float 2.5s ease-in-out infinite alternate; }
      @keyframes run { to { stroke-dashoffset: 840; } }
      @keyframes float { 0% { transform: translateY(0px) scale(1.6); } 100% { transform: translateY(-3px) scale(1.6); } }
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg" />
  <rect width="99%" height="96%" x="2" y="2" class="border-glow" />
  
