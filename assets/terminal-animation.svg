<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" height="220">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400&amp;display=swap');
      .bg { fill: #0B0E14; rx: 8px; stroke: #101720; stroke-width: 2; }
      .top-bar { fill: #101720; rx: 8px; }
      .btn-red { fill: #FF5F56; }
      .btn-yel { fill: #FFBD2E; }
      .btn-grn { fill: #27C93F; }
      .txt { font-family: 'Fira Code', monospace; font-size: 14px; fill: #93A4B7; opacity: 0; animation: fadeText 0.1s forwards; }
      .cmd { fill: #39FF88; font-weight: bold; }
      .dir { fill: #00E5FF; }
      .cursor { fill: #39FF88; animation: blink 1s step-end infinite; }
      
      @keyframes fadeText { to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
      
      .l1 { animation-delay: 0.5s; }
      .l2 { animation-delay: 1.2s; }
      .l3 { animation-delay: 1.8s; }
      .l4 { animation-delay: 2.5s; }
      .l5 { animation-delay: 3.2s; }
      .l6 { animation-delay: 4.0s; }
    </style>
  </defs>
  <!-- Window -->
  <rect width="100%" height="100%" class="bg" />
  <path d="M 0 8 Q 0 0 8 0 L 692 0 Q 700 0 700 8 L 700 30 L 0 30 Z" class="top-bar" />
  <circle cx="20" cy="15" r="6" class="btn-red" />
  <circle cx="40" cy="15" r="6" class="btn-yel" />
  <circle cx="60" cy="15" r="6" class="btn-grn" />
  
  <!-- Terminal Text -->
  <g transform="translate(20, 60)">
    <text y="0" class="txt l1"><tspan class="cmd">brijesh@darkcypher</tspan>:<tspan class="dir">~</tspan>$ ./initialize_profile.sh</text>
    <text y="25" class="txt l2">> loading laravel backend modules... [OK]</text>
    <text y="50" class="txt l3">> verifying external API integrations (Shopify, SP-API)... [OK]</text>
    <text y="75" class="txt l4">> compiling cross-platform flutter widgets... [OK]</text>
    <text y="100" class="txt l5">> running database migrations... [OK]</text>
    <text y="135" class="txt l6"><tspan class="cmd">brijesh@darkcypher</tspan>:<tspan class="dir">~/workspace</tspan>$ status: continuously improving<tspan class="cursor">_</tspan></text>
  </g>
</svg>
